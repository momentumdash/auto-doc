# Keeps the floating major tag (v2) on the newest vMAJOR.MINOR.PATCH release,
# so callers pin `@v2` once instead of editing every repo per release.
#
# The push below is made with GITHUB_TOKEN, and GitHub doesn't start workflow
# runs from GITHUB_TOKEN pushes, so moving the major tag can't re-trigger this.
# The `protect release tags` ruleset must allow updating the major tag for
# this to succeed; see "Releasing" in the README.
name: Move major tag

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Force-move the major tag to this release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          major="${RELEASE_TAG%%.*}"
          git tag -f "$major" "$RELEASE_TAG"
          git push --force origin "refs/tags/$major"
