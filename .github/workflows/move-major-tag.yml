# Keeps the floating major tag (v2) on the newest vMAJOR.MINOR.PATCH release,
# so callers pin `@v2` once instead of editing every repo per release.
#
# The push below is made with GITHUB_TOKEN, and GitHub doesn't start workflow
# runs from GITHUB_TOKEN pushes, so moving the major tag can't re-trigger this.
# The `protect release tags` ruleset must allow updating the major tag for
# this to succeed; see "Releasing" in the README.
name: Move major tag

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force-move the major tag to this release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          major="${RELEASE_TAG%%.*}"
          # The ruleset doesn't stop anyone with write access creating a
          # v2.x.y tag on an unmerged branch, so only follow releases on main.
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "::error::$RELEASE_TAG is not on main; not moving $major"
            exit 1
          fi
          # Never move backwards on out-of-order tagging; roll back by hand.
          if git rev-parse -q --verify "refs/tags/$major" >/dev/null &&
            ! git merge-base --is-ancestor "$major" "$RELEASE_TAG"; then
            echo "::error::$major is not an ancestor of $RELEASE_TAG; not moving it"
            exit 1
          fi
          git tag -f "$major" "$RELEASE_TAG"
          git push --force origin "refs/tags/$major"
