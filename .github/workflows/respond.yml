# Reusable feedback responder for auto-doc PRs. Call it from a repo so that a
# human's comment on an `auto-doc`-labeled PR (the cleanup or integrator doc
# PRs) gets acted on: revert a change, apply a requested edit, or reply.
#
# Trigger model (declared in the caller, see examples/auto-doc-respond.yml):
#   - pull_request_review.submitted  -> the whole review, as ONE batch
#   - issue_comment.created          -> a single top-level PR comment
# GitHub fires pull_request_review for every inline comment, a lone thread reply
# included, so pull_request_review_comment would only double-run the same
# feedback; it is not handled here. A re-delivered event is still safe: the
# responder skips threads that are already resolved, and per-PR concurrency
# means the second run sees the first run's resolution.
#
# Feedback loop for the commenter: 👀 on their comment when the job starts, a
# reply from the agent on every item, and a failure comment with the run link
# (job red) if the agent errored or was denied a tool.
#
# Loop safety: the job only runs for non-Bot authors, so the bot's own
# reactions, replies, and failure comments (GitHub App or github-actions, both
# type Bot) never re-trigger it; under GITHUB_TOKEN the events are suppressed
# anyway, and reactions fire no workflow event at all.

name: Auto-doc respond

on:
  workflow_call:
    inputs:
      auto-doc-ref:
        description: Ref of momentumdash/auto-doc to run. Keep in sync with the ref you call this workflow at.
        type: string
        default: v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for claude-code-action.
        required: true
      AUTO_DOC_APP_ID:
        description: GitHub App ID, for a dedicated bot identity. Requires vars.AUTO_DOC_USE_APP == 'true'.
        required: false
      AUTO_DOC_APP_PRIVATE_KEY:
        description: GitHub App private key (PEM). Requires vars.AUTO_DOC_USE_APP == 'true'.
        required: false

# Serialize per PR so two comments never race edits to the same head branch.
concurrency:
  group: auto-doc-respond-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  respond:
    # Only human comments on an auto-doc-labeled PR. The non-Bot check is the
    # loop guard; the label check keeps this to the bot's own PRs.
    if: >
      (github.event_name == 'pull_request_review' &&
        github.event.action == 'submitted' &&
        github.event.review.user.type != 'Bot' &&
        contains(github.event.pull_request.labels.*.name, 'auto-doc')) ||
      (github.event_name == 'issue_comment' &&
        github.event.action == 'created' &&
        github.event.issue.pull_request != null &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.issue.labels.*.name, 'auto-doc'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # Deterministic denylist enforcement. The job `if:` structurally blocks
      # Bot-type authors; this catches bots backed by a plain user account
      # (AUTO_DOC_IGNORE_AUTHORS) in code rather than trusting the agent to obey
      # a prompt. If the triggering actor is denylisted, the token, prompt, and
      # agent steps below are skipped.
      - name: Author denylist guard
        id: guard
        env:
          ACTOR: ${{ github.event.review.user.login || github.event.comment.user.login }}
          DENYLIST: ${{ vars.AUTO_DOC_IGNORE_AUTHORS }}
        run: |
          # shellcheck disable=SC2153  # ACTOR and DENYLIST come from the env: block above
          actor="$(printf '%s' "$ACTOR" | tr '[:upper:]' '[:lower:]')"
          denied=false
          IFS=',' read -ra names <<< "$DENYLIST"
          for n in "${names[@]}"; do
            n="$(printf '%s' "$n" | xargs | tr '[:upper:]' '[:lower:]')"
            if [ -n "$n" ] && [ "$n" = "$actor" ]; then denied=true; fi
          done
          echo "denied=$denied" >> "$GITHUB_OUTPUT"
          if [ "$denied" = true ]; then echo "auto-doc: actor '$ACTOR' is denylisted; skipping."; fi

      - name: Checkout calling repo
        if: ${{ steps.guard.outputs.denied != 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout auto-doc
        if: ${{ steps.guard.outputs.denied != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: momentumdash/auto-doc
          ref: ${{ inputs.auto-doc-ref }}
          path: _auto-doc
          fetch-depth: 1

      # Out of the workspace before anything else: the responder works inside
      # this checkout and would otherwise sweep the vendored scripts into the PR
      # branch. The last step still needs them, so move rather than delete.
      - name: Move auto-doc out of the workspace
        if: ${{ steps.guard.outputs.denied != 'true' }}
        run: mv _auto-doc "$RUNNER_TEMP/auto-doc"

      - name: Mint GitHub App token (optional, for dedicated bot identity)
        id: app_token
        if: ${{ vars.AUTO_DOC_USE_APP == 'true' && steps.guard.outputs.denied != 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTO_DOC_APP_ID }}
          private-key: ${{ secrets.AUTO_DOC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: React 👀 on the feedback
        if: ${{ steps.guard.outputs.denied != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_NODE_ID: ${{ github.event.review.node_id }}
          REVIEW_BODY: ${{ github.event.review.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: node "$RUNNER_TEMP/auto-doc/scripts/respond-status.js" eyes

      - name: Build responder prompt
        id: build_prompt
        if: ${{ steps.guard.outputs.denied != 'true' }}
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          # Exactly one of these is set, per event type.
          REVIEW_ID: ${{ github.event.review.id }}
          COMMENT_ID: ${{ github.event.comment.id }}
          AUTO_DOC_IGNORE_AUTHORS: ${{ vars.AUTO_DOC_IGNORE_AUTHORS }}
        run: |
          {
            echo 'prompt<<__AUTO_DOC_EOF__'
            node "$RUNNER_TEMP/auto-doc/scripts/build-prompt.js" respond
            echo
            echo '__AUTO_DOC_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Run responder
        id: responder
        if: ${{ steps.guard.outputs.denied != 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.build_prompt.outputs.prompt }}
          # gh narrowed to api + pr (no secret/repo/workflow/auth); the prompt
          # further forbids merge, force-push, and settings/secret changes. This
          # surface fires on every comment, so it is tighter than the integrator's.
          # Quoted because the action shell-splits claude_args: unquoted, the
          # space in `gh api` splits the pattern and neither rule is allowed.
          claude_args: '--allowed-tools "Bash(gh api:*),Bash(gh pr:*),Bash(git:*),Bash(find:*),Read,Edit,Write,Grep,Glob"'

      # The action ends green when the agent was denied tools, so judge the
      # execution file too. Runs after any earlier failure as well, so the
      # commenter always hears back.
      - name: Report failure on the PR
        if: ${{ !cancelled() && steps.guard.outputs.denied != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
          OUTCOME: ${{ steps.responder.outcome }}
          EXECUTION_FILE: ${{ steps.responder.outputs.execution_file }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="$(node "$RUNNER_TEMP/auto-doc/scripts/respond-status.js" verdict "$EXECUTION_FILE")" && [ "$OUTCOME" = success ] && exit 0
          [ "$OUTCOME" = success ] || reason="responder step ${OUTCOME:-not run}${reason:+, $reason}"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "auto-doc couldn't finish acting on this feedback ($reason). Run: $RUN_URL"
          echo "::error::auto-doc respond failed: $reason"
          exit 1
