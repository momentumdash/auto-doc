# Reusable auto-doc extractor. Call it from a repo that wants PR review
# comments classified into proposed documentation rules.
#
# Every trigger routes through one Node entrypoint (scripts/extract.js):
#   - pull_request_review.submitted        → classify all inline comments in the review
#   - pull_request_review_comment.edited   → reclassify one inline comment
#   - issue_comment.created/edited         → classify one top-level PR comment
#
# extract.js classifies each comment with a direct Haiku call (classify.js) —
# no keyword pre-filter — then does the gh post/edit/delete mechanics
# deterministically (github-comments.js).
#
# See examples/auto-doc-extract.yml for the caller.

name: Auto-doc extract

on:
  workflow_call:
    inputs:
      auto-doc-ref:
        description: Ref of momentumdash/auto-doc to run. Keep in sync with the ref you call this workflow at.
        type: string
        default: v1
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key for the classification calls.
        required: true
      AUTO_DOC_APP_ID:
        description: GitHub App ID, for a dedicated bot identity. Requires vars.AUTO_DOC_USE_APP == 'true'.
        required: false
      AUTO_DOC_APP_PRIVATE_KEY:
        description: GitHub App private key (PEM). Requires vars.AUTO_DOC_USE_APP == 'true'.
        required: false

# Serialize per review (batch) or per comment (single); cancel superseded runs.
# extract.js re-reads existing replies from the API, so the latest run is correct.
concurrency:
  group: auto-doc-extract-${{ github.event.review.id || github.event.comment.id }}
  cancel-in-progress: true

jobs:
  extract:
    # Cheap pre-filter only — extract.js re-checks bot authorship and the
    # auto-doc label itself, so a caller may omit its own guards entirely.
    if: |
      github.event.comment.user.type != 'Bot' &&
      github.event.review.user.type != 'Bot' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      !contains(github.event.issue.labels.*.name, 'auto-doc') &&
      !contains(github.event.pull_request.labels.*.name, 'auto-doc')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Only the auto-doc scripts are needed — the extractor talks to the
      # GitHub API and never reads the calling repo's code.
      - name: Checkout auto-doc
        uses: actions/checkout@v4
        with:
          repository: momentumdash/auto-doc
          ref: ${{ inputs.auto-doc-ref }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mint GitHub App token (optional, for dedicated bot identity)
        id: app_token
        if: ${{ vars.AUTO_DOC_USE_APP == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTO_DOC_APP_ID }}
          private-key: ${{ secrets.AUTO_DOC_APP_PRIVATE_KEY }}
          # The App is installed org-wide; scope the token to the calling repo.
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Install dependencies
        working-directory: scripts
        run: npm ci

      - name: Run extractor
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
        run: node extract.js
