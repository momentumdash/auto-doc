# Copy to .github/workflows/auto-doc-respond.yml in the consuming repo.
# Acts on a human's feedback on an auto-doc PR: revert a change, apply a
# requested edit, or reply. The reusable workflow guards on the auto-doc label
# and non-bot authorship, so these triggers can stay broad.
name: Auto-doc respond

on:
  # A submitted review arrives as one event (its inline comments ride along);
  # a standalone inline comment and a top-level comment each fire their own.
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  respond:
    uses: momentumdash/auto-doc/.github/workflows/respond.yml@v1
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AUTO_DOC_APP_ID: ${{ secrets.AUTO_DOC_APP_ID }}
      AUTO_DOC_APP_PRIVATE_KEY: ${{ secrets.AUTO_DOC_APP_PRIVATE_KEY }}
