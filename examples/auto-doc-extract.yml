# Copy to .github/workflows/auto-doc-extract.yml in the consuming repo.
name: Auto-doc extract

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [edited]
  issue_comment:
    types: [created, edited]

jobs:
  extract:
    uses: momentumdash/auto-doc/.github/workflows/extract.yml@v1
    # Named explicitly rather than `secrets: inherit`. Inherit hands the called
    # workflow EVERY secret this repo has, not just the ones it declares — and
    # this one is defined in a public repo behind a movable tag.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AUTO_DOC_APP_ID: ${{ secrets.AUTO_DOC_APP_ID }}
      AUTO_DOC_APP_PRIVATE_KEY: ${{ secrets.AUTO_DOC_APP_PRIVATE_KEY }}
