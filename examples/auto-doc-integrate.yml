# Copy to .github/workflows/auto-doc-integrate.yml in the consuming repo.
name: Auto-doc integrate

on:
  pull_request:
    types: [closed]

jobs:
  integrate:
    uses: momentumdash/auto-doc/.github/workflows/integrate.yml@v1
    # Declared here, not just in the called workflow: a reusable workflow
    # cannot grant its job more than the caller's GITHUB_TOKEN already has,
    # so a repo defaulting to read-only would silently cap these.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Named explicitly rather than `secrets: inherit`. Inherit hands the called
    # workflow EVERY secret this repo has, not just the ones it declares — and
    # this one is defined in a public repo behind a movable tag.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AUTO_DOC_APP_ID: ${{ secrets.AUTO_DOC_APP_ID }}
      AUTO_DOC_APP_PRIVATE_KEY: ${{ secrets.AUTO_DOC_APP_PRIVATE_KEY }}
    # Defaults to the repo's default branch. Override here, or set the
    # AUTO_DOC_BASE_BRANCH repo variable, when doc PRs should target an
    # integration branch instead (e.g. develop).
    # with:
    #   base-branch: develop
