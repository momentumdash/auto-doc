# Copy to .github/workflows/auto-doc-cleanup.yml in the consuming repo.
name: Auto-doc cleanup

on:
  # Weekly. Mondays 09:00 UTC — adjust to taste. Triggers must live here: a
  # reusable workflow can't declare its own schedule.
  schedule:
    - cron: '0 9 * * 1'
  # Lets you run a cleanup on demand from the Actions tab.
  workflow_dispatch:

jobs:
  cleanup:
    uses: momentumdash/auto-doc/.github/workflows/cleanup.yml@v1
    # Declared here, not just in the called workflow: a reusable workflow
    # cannot grant its job more than the caller's GITHUB_TOKEN already has,
    # so a repo defaulting to read-only would silently cap these.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Named explicitly rather than `secrets: inherit`. Inherit hands the called
    # workflow EVERY secret this repo has, not just the ones it declares — and
    # this one is defined in a public repo behind a movable tag.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AUTO_DOC_APP_ID: ${{ secrets.AUTO_DOC_APP_ID }}
      AUTO_DOC_APP_PRIVATE_KEY: ${{ secrets.AUTO_DOC_APP_PRIVATE_KEY }}
    # Defaults to the repo's default branch. Override here, or set the
    # AUTO_DOC_BASE_BRANCH repo variable, when the cleanup PR should target an
    # integration branch instead (e.g. develop).
    # with:
    #   base-branch: develop
